# Tiny Tapeout project information
project:
  title:        "ProtocolForge ASIC"
  author:       "Maddox & Team"
  discord:      ""
  description:  "High-performance programmable protocol emulator with hardware SBE, BSU, streaming CRC, auto-baud, and deadline scheduling"
  language:     "Verilog"
  clock_hz:     50000000

  # Jane Street Protocol Emulator ASIC Competition allocation
  tiles: "6x4"

  # Top module name
  top_module:  "tt_um_maddox_protocolforge"

  # Project source files
  source_files:
    - "project.v"
    - "forge_core.v"
    - "forge_fifo.v"
    - "forge_crc.v"
    - "forge_sbe_bsu.v"
    - "forge_abu.v"
    - "forge_spi.v"

# Pinout of ProtocolForge
pinout:
  # Dedicated Inputs (GPIO 0..7)
  ui[0]: "GPIO0 (IN / Auto-Baud Sense)"
  ui[1]: "GPIO1 (IN)"
  ui[2]: "GPIO2 (IN)"
  ui[3]: "GPIO3 (IN)"
  ui[4]: "GPIO4 (IN)"
  ui[5]: "GPIO5 (IN)"
  ui[6]: "GPIO6 (IN)"
  ui[7]: "GPIO7 (IN)"

  # Dedicated Outputs (GPIO 8..15)
  uo[0]: "GPIO8 (OUT)"
  uo[1]: "GPIO9 (OUT)"
  uo[2]: "GPIO10 (OUT)"
  uo[3]: "GPIO11 (OUT)"
  uo[4]: "GPIO12 (OUT)"
  uo[5]: "GPIO13 (OUT)"
  uo[6]: "GPIO14 (OUT)"
  uo[7]: "GPIO15 (OUT)"

  # Bidirectional pins (GPIO 16..19 + Host SPI Slave)
  uio[0]: "GPIO16 (BIDIR / Open-Drain)"
  uio[1]: "GPIO17 (BIDIR / Open-Drain)"
  uio[2]: "GPIO18 (BIDIR / Open-Drain)"
  uio[3]: "GPIO19 (BIDIR / Open-Drain)"
  uio[4]: "HOST_CS_N (Host SPI Slave Select)"
  uio[5]: "HOST_SCK (Host SPI Clock max 12.5MHz)"
  uio[6]: "HOST_MOSI (Host SPI Data In)"
  uio[7]: "HOST_MISO (Host SPI Data Out & Telemetry)"

# Do not change!
yaml_version: 6
